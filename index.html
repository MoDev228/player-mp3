<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="192x192" href="/192x192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      try {
        if (localStorage.getItem("theme") === "dark") {
          document.documentElement.classList.add("dark");
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute("content", "#1a1714");
        }
      } catch {}
    </script>
    <meta
      name="description"
      content="Écoutez le Coran verset par verset : dix récitations arabes (Shuraym, ash-Shāṭirī, Husary, as-Sudays, al-Muʿayqlī, al-Ḥudhayfī, Baṣfar, ar-Rifāʿī, Suwaid) ou deux voix françaises (Rachid Maach, Youssouf Leclerc), texte arabe ou français dont la traduction Hamidullah, affichage bilingue, signets, recherche, boucle A–B, minuteur de sommeil et écoute hors connexion. Sans compte ni publicité."
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Quran MP3" />
    <link rel="apple-touch-icon" href="/192x192.png" />
    <title>Quran MP3 — Écoutez le Coran</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
